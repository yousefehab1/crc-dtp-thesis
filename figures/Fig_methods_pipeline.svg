<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c7c3bf"/></marker>
</defs>

<!-- platform-specific inputs -->
<rect x="20" y="24" width="250" height="58" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="145" y="45" fill="#1c1917" font-size="12.5" font-weight="bold" text-anchor="middle">Microarray</text>
<text x="145" y="62" fill="#6b6b6b" font-size="11" text-anchor="middle">probe to symbol · log2</text>
<text x="145" y="76" fill="#6b6b6b" font-size="11" text-anchor="middle">mean-collapse duplicates</text>

<rect x="285" y="24" width="250" height="58" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="410" y="45" fill="#1c1917" font-size="12.5" font-weight="bold" text-anchor="middle">RNA-seq counts (TCGA)</text>
<text x="410" y="62" fill="#6b6b6b" font-size="11" text-anchor="middle">TPM · log2(TPM+1)</text>
<text x="410" y="76" fill="#6b6b6b" font-size="11" text-anchor="middle">mean-collapse duplicates</text>

<rect x="550" y="24" width="250" height="58" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="675" y="45" fill="#1c1917" font-size="12.5" font-weight="bold" text-anchor="middle">RNA-seq FPKM</text>
<text x="675" y="62" fill="#6b6b6b" font-size="11" text-anchor="middle">log2(FPKM+1)</text>
<text x="675" y="76" fill="#6b6b6b" font-size="11" text-anchor="middle">sum additive sub-features</text>

<!-- converge -->
<path d="M145,82 L145,100 M410,82 L410,100 M675,82 L675,100 M145,100 L675,100" stroke="#c7c3bf" stroke-width="1.4" fill="none"/>
<path d="M410,100 L410,120" stroke="#c7c3bf" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

<!-- central processing stack -->
<rect x="220" y="120" width="380" height="40" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="410" y="145" fill="#1c1917" font-size="12.5" text-anchor="middle">Convert to Ensembl gene IDs (cached map)</text>
<path d="M410,160 L410,178" stroke="#c7c3bf" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

<rect x="220" y="178" width="380" height="40" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="410" y="203" fill="#1c1917" font-size="12.5" text-anchor="middle">log2, gene-indexed expression matrix</text>
<path d="M410,218 L410,236" stroke="#c7c3bf" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

<rect x="220" y="236" width="380" height="40" rx="7" fill="#eef2f6" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="410" y="261" fill="#1c1917" font-size="12.5" font-weight="bold" text-anchor="middle">ssGSEA scoring · 70% coverage gate</text>
<path d="M410,276 L410,294" stroke="#c7c3bf" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

<rect x="220" y="294" width="380" height="46" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="410" y="314" fill="#1c1917" font-size="12.5" text-anchor="middle" font-weight="bold">Signature scores</text>
<text x="410" y="331" fill="#6b6b6b" font-size="11.5" text-anchor="middle">Up · Down · Composite  (+ 6 reference sets)</text>

<!-- side branch: subtype exception -->
<path d="M600,198 L636,198" stroke="#c7c3bf" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="638" y="172" width="168" height="52" rx="7" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="722" y="192" fill="#1c1917" font-size="11.5" text-anchor="middle" font-weight="bold">Subtype callers</text>
<text x="722" y="207" fill="#6b6b6b" font-size="10.5" text-anchor="middle">CMS, PDS use a</text>
<text x="722" y="220" fill="#6b6b6b" font-size="10.5" text-anchor="middle">log2 symbol matrix</text>

<!-- footer -->
<text x="410" y="372" fill="#6b6b6b" font-size="11" text-anchor="middle" font-style="italic">Deterministic under one global seed; only GSEA tie-breaking is stochastic.</text>
</svg>
