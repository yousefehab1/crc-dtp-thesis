<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<!-- Row 1: univariable -->
<text x="24" y="44" fill="#6b6b6b" font-size="11" letter-spacing="1">UNIVARIABLE</text>
<text x="24" y="60" fill="#1c1917" font-size="12.5" font-weight="bold">Does the score relate to outcome?</text>
<rect x="24" y="72" width="150" height="40" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="99" y="97" fill="#1c1917" font-size="12" text-anchor="middle">DTP score</text>
<path d="M174,92 L236,92" stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="238" y="72" width="150" height="40" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="313" y="97" fill="#1c1917" font-size="12" text-anchor="middle">outcome</text>
<text x="410" y="90" fill="#6b6b6b" font-size="11.5">Reports: hazard ratio per 1 SD,</text>
<text x="410" y="106" fill="#6b6b6b" font-size="11.5">concordance index.</text>
<line x1="24" y1="132" x2="796" y2="132" stroke="#ececec" stroke-width="1"/>

<!-- Row 2: adjusted -->
<text x="24" y="164" fill="#6b6b6b" font-size="11" letter-spacing="1">ADJUSTED · CONFOUNDING</text>
<text x="24" y="180" fill="#1c1917" font-size="12.5" font-weight="bold">Does the score add information beyond clinicopathology?</text>
<rect x="24" y="192" width="230" height="40" rx="7" fill="#eef2f6" stroke="#3b6ea5" stroke-width="1.3"/>
<text x="139" y="211" fill="#1c1917" font-size="12" text-anchor="middle">score + stage / MSI /</text>
<text x="139" y="226" fill="#1c1917" font-size="12" text-anchor="middle">CMS / PDS</text>
<path d="M254,212 L316,212" stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="318" y="192" width="150" height="40" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="393" y="217" fill="#1c1917" font-size="12" text-anchor="middle">outcome</text>
<text x="490" y="204" fill="#6b6b6b" font-size="11.5">Reports: change-in-estimate,</text>
<text x="490" y="220" fill="#6b6b6b" font-size="11.5">LRT vs covariate-only model,</text>
<text x="490" y="236" fill="#6b6b6b" font-size="11.5">concordance.</text>
<line x1="24" y1="252" x2="796" y2="252" stroke="#ececec" stroke-width="1"/>

<!-- Row 3: interaction -->
<text x="24" y="284" fill="#6b6b6b" font-size="11" letter-spacing="1">INTERACTION · EFFECT MODIFICATION</text>
<text x="24" y="300" fill="#1c1917" font-size="12.5" font-weight="bold">Does the score's effect differ between subgroups?</text>
<rect x="24" y="312" width="230" height="40" rx="7" fill="#eef2f6" stroke="#3b6ea5" stroke-width="1.3"/>
<text x="139" y="337" fill="#1c1917" font-size="12" text-anchor="middle">score × modifier</text>
<path d="M254,332 L316,332" stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="318" y="312" width="150" height="40" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="393" y="337" fill="#1c1917" font-size="12" text-anchor="middle">outcome</text>
<text x="490" y="324" fill="#6b6b6b" font-size="11.5">Reports: LRT of the product</text>
<text x="490" y="340" fill="#6b6b6b" font-size="11.5">term vs the additive model.</text>

<!-- footer gate -->
<rect x="24" y="378" width="772" height="34" rx="7" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="410" y="399" fill="#1c1917" font-size="11.5" text-anchor="middle">Both multivariable families are fitted only where there are at least 10 events per variable (EPV gate).</text>

<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b6ea5"/></marker>
</defs>
</svg>
