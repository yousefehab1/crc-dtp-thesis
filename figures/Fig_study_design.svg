<svg viewBox="0 0 780 468" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<text x="24" y="22" fill="#6b6b6b" font-size="12" font-style="italic">A transcriptomic drug-tolerant persister programme, one signature tested three ways</text>

<!-- shared core -->
<rect x="24" y="36" width="732" height="56" rx="8" fill="#eef2f6" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="40" y="56" fill="#6b6b6b" font-size="10" letter-spacing="1">SHARED CORE</text>
<text x="40" y="74" fill="#1c1917" font-size="15" font-weight="bold">DTP signature — Up · Down · Composite  (+ 6 reference sets)</text>
<text x="40" y="88" fill="#6b6b6b" font-size="11">scored in every dataset by ssGSEA single-sample scoring</text>

<!-- connectors -->
<path d="M139,128 L139,104 L637,104 L637,128 M390,92 L390,128" stroke="#c7c3bf" stroke-width="1.4" fill="none"/>

<!-- card 1 -->
<rect x="24" y="128" width="230" height="232" rx="8" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<rect x="24" y="128" width="230" height="6" rx="3" fill="#3b6ea5"/>
<text x="40" y="156" fill="#6b6b6b" font-size="10" letter-spacing="1">PREDICTION 1</text>
<text x="40" y="178" fill="#1c1917" font-size="15" font-weight="bold">Primary CRC outcome</text>
<text x="40" y="199" fill="#3b6ea5" font-size="11.5" font-style="italic">Does it track patient outcome?</text>
<text x="40" y="224" fill="#1c1917" font-size="12">GSE39582 ~585</text>
<text x="40" y="242" fill="#1c1917" font-size="12">TCGA-COAD 455</text>
<text x="40" y="268" fill="#6b6b6b" font-size="12">Cox / KM · OS + RFS</text>
<text x="40" y="286" fill="#6b6b6b" font-size="12">subgroups · multivariable</text>
<text x="40" y="332" fill="#6b6b6b" font-size="12" font-style="italic">§3.2–3.4 · Fig 4–9</text>

<!-- card 2 -->
<rect x="275" y="128" width="230" height="232" rx="8" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<rect x="275" y="128" width="230" height="6" rx="3" fill="#3b6ea5"/>
<text x="291" y="156" fill="#6b6b6b" font-size="10" letter-spacing="1">PREDICTION 2</text>
<text x="291" y="178" fill="#1c1917" font-size="15" font-weight="bold">Pan-cancer</text>
<text x="291" y="199" fill="#3b6ea5" font-size="11.5" font-style="italic">Does it hold across tissues?</text>
<text x="291" y="224" fill="#1c1917" font-size="12">25 TCGA cohorts</text>
<text x="291" y="242" fill="#1c1917" font-size="12">~8,900 patients</text>
<text x="291" y="268" fill="#6b6b6b" font-size="12">per-cohort Cox and</text>
<text x="291" y="286" fill="#6b6b6b" font-size="12">batch-corrected pooling</text>
<text x="291" y="332" fill="#6b6b6b" font-size="12" font-style="italic">§3.5 · Fig 10–11</text>

<!-- card 3 -->
<rect x="526" y="128" width="230" height="232" rx="8" fill="#f6f5f3" stroke="#d6d3d1" stroke-width="1.2"/>
<rect x="526" y="128" width="230" height="6" rx="3" fill="#3b6ea5"/>
<text x="542" y="156" fill="#6b6b6b" font-size="10" letter-spacing="1">PREDICTION 3</text>
<text x="542" y="178" fill="#1c1917" font-size="15" font-weight="bold">Metastasis</text>
<text x="542" y="199" fill="#3b6ea5" font-size="11.5" font-style="italic">Is it enriched in metastasis?</text>
<text x="542" y="224" fill="#1c1917" font-size="12">GSE50760 paired</text>
<text x="542" y="242" fill="#1c1917" font-size="12">N / P / M · ~18 patients</text>
<text x="542" y="268" fill="#6b6b6b" font-size="12">liver-adjusted paired</text>
<text x="542" y="286" fill="#6b6b6b" font-size="12">DE and GSEA</text>
<text x="542" y="332" fill="#6b6b6b" font-size="12" font-style="italic">§3.6 · Fig 12–13</text>

<!-- funnel to synthesis -->
<path d="M139,360 L139,382 L390,382 M641,360 L641,382 L390,382 M390,360 L390,398" stroke="#c7c3bf" stroke-width="1.4" fill="none"/>

<!-- synthesis -->
<rect x="180" y="398" width="420" height="46" rx="8" fill="#eef2f6" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="390" y="419" fill="#1c1917" font-size="14" font-weight="bold" text-anchor="middle">§3.7 Synthesis</text>
<text x="390" y="436" fill="#6b6b6b" font-size="12" text-anchor="middle">one programme, three independent tests</text>
</svg>
